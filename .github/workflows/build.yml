name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    name: Linux Build

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -y install build-essential cmake zlib1g-dev libgl1-mesa-dev libusb-1.0-0-dev qtbase5-dev libqt5widgets5 libqt5gui5 qt5-qmake

    - name: Build
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make

    - name: Create Linux Package
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p heimdall-linux-release
        cp build/bin/heimdall heimdall-linux-release/
        cp build/bin/heimdall-frontend heimdall-linux-release/ || true
        tar -czf heimdall-linux-x64.tar.gz heimdall-linux-release/
        ls -lh heimdall-linux-x64.tar.gz

    - name: Upload Linux Build Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: heimdall-linux-x64.tar.gz
        retention-days: 1

  windows-build:
    runs-on: windows-latest
    name: Windows Build

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          make
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-libusb

    - name: Build
      shell: msys2 {0}
      run: |
        export PATH="/mingw64/bin:$PATH"
        export CMAKE_PREFIX_PATH=/mingw64/lib/cmake:$CMAKE_PREFIX_PATH
        mkdir build
        cd build
        cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DDISABLE_FRONTEND=ON ..
        make

    - name: Create Windows Package
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        mkdir -p heimdall-windows-release
        cp build/bin/heimdall.exe heimdall-windows-release/ || cp build/bin/heimdall heimdall-windows-release/ || true
        cd heimdall-windows-release
        7z a ../heimdall-windows-x64.zip *
        cd ..
        ls -lh heimdall-windows-x64.zip

    - name: Upload Windows Build Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: heimdall-windows-x64.zip
        retention-days: 1

  create-release:
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Linux Build
      uses: actions/download-artifact@v4
      with:
        name: linux-build

    - name: Download Windows Build
      uses: actions/download-artifact@v4
      with:
        name: windows-build

    - name: List Artifacts
      run: |
        echo "=== Artifacts Downloaded ==="
        ls -lh
        ls -lh heimdall-*
        echo "=== File Details ==="
        file heimdall-*

    - name: Get Release Info
      id: release_info
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Release tag: $TAG"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          heimdall-linux-x64.tar.gz
          heimdall-windows-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
